appId: com.gestorhoras.app
productName: Gestor de Horas
copyright: Uso interno
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - "!node_modules/**/*"
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: GestorHoras-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Gestor de Horas
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  # Los datos (%APPDATA%/Gestor de Horas) NO se borran al desinstalar ni al actualizar.
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  language: "3082"
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: build/icons
  category: Office
  executableName: gestor-horas
  # Wayland no permite colocar ventanas ni mantenerlas encima (lo necesita el reloj flotante).
  executableArgs: ["--ozone-platform=x11"]
  synopsis: Registro e imputación de horas de trabajo
  description: Herramienta personal y local para registrar e imputar horas de trabajo a proyectos, con reloj flotante y recordatorios.
  maintainer: Alejandro Jiménez <alejmnz0@users.noreply.github.com>
  artifactName: GestorHoras-${version}-${arch}.${ext}
  desktop:
    entry:
      Name: Gestor de Horas
      Comment: Registro e imputación de horas de trabajo
      Keywords: horas;imputación;tiempo;proyectos;
      StartupWMClass: Gestor de Horas
deb:
  # Bandeja del sistema en GNOME/Ubuntu (AppIndicator); el resto ya lo incluye electron-builder.
  recommends:
    - libayatana-appindicator3-1
# Solo los idiomas necesarios (reduce el tamaño del instalador).
electronLanguages:
  - es
  - en-US
compression: maximum
publish: null
